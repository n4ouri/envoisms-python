[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "envoisms"
version = "1.1.1"
description = "Official Python SDK for EnvoiSMS.ma - direct-operator SMS, WhatsApp Business API (WABA) and OTP/2FA verification for Morocco"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "EnvoiSMS.ma", email = "contact@envoisms.ma"}
]
keywords = ["envoisms", "sms", "morocco", "maroc", "otp", "2fa", "whatsapp", "whatsapp-api", "whatsapp-business-api", "sms-api", "sms-gateway", "bulk-sms", "africa", "verification"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Telephony",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: French",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.25.0"
]

[project.urls]
Homepage = "https://envoisms.ma"
Documentation = "https://envoisms.ma/fr/docs/"
Pricing = "https://envoisms.ma/fr/tarifs/"
Repository = "https://github.com/n4ouri/envoisms-python"
"Bug Tracker" = "https://github.com/n4ouri/envoisms-python/issues"
